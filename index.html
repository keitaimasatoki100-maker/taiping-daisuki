    <script>
        // Web Audio Synthesizer for self-contained sound effects
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playType() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch (e) {}
            }

            playMiss() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch (e) {}
            }

            playTick() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            playStart() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {}
            }

            playLock() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch (e) {}
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('typing_rush_100_v6');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {}

            const todayStr = new Date().toISOString().split('T')[0];
            const lastLogin = localStorage.getItem('typing_rush_last_login');
            if (lastLogin !== todayStr) {
                if (lastLogin) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    const yestStr = yesterday.toISOString().split('T')[0];
                    if (lastLogin === yestStr) {
                        state.loginStreak += 1;
                    } else {
                        state.loginStreak = 1;
                    }
                }
                localStorage.setItem('typing_rush_last_login', todayStr);
                checkDailyUnlock();
            }
            saveState();
        }

        function saveState() {
            try {
                localStorage.setItem('typing_rush_100_v6', JSON.stringify(state));
            } catch (e) {}
        }

        function checkDailyUnlock() {
            const todayStr = new Date().toISOString().split('T')[0];
            if (state.allPlayedAchievedDate && state.allPlayedAchievedDate !== todayStr && state.lastUnlockDate !== todayStr) {
                const allCourseIds = [];
                COURSE_CATEGORIES.forEach(cat => cat.courses.forEach(c => allCourseIds.push(c.id)));
                const locked = allCourseIds.filter(id => !state.unlockedCourses.includes(id));
                
                if (locked.length > 0) {
                    const newUnlocked = locked[Math.floor(Math.random() * locked.length)];
                    state.unlockedCourses.push(newUnlocked);
                    state.lastUnlockDate = todayStr;
                    state.allPlayedAchievedDate = null;
                    
                    let unlockedName = newUnlocked;
                    COURSE_CATEGORIES.forEach(cat => cat.courses.forEach(c => {
                        if (c.id === newUnlocked) unlockedName = getPlainTitle(c.name);
                    }));
                    
                    setTimeout(() => {
                        alert(`🎉 昨日すべての解放コースを3回以上クリアしたため、新しいコース『${unlockedName}』が解放されました！`);
                    }, 500);
                }
            }
        }

                `⭐ 累計スコアが ${state.totalScore.toLocaleString()} pt になったよ！すごい！`,
                `💡 タイピングができると、学校の宿題や検索がサクサク進むよ！`,
                `🎨 3回プレイしたコースは、色が緑色にかわるよ！`
            ];

            let neededCourseName = '';
            let remainingPlays = 0;
            for (const cat of COURSE_CATEGORIES) {
                for (const c of cat.courses) {
                    if (state.unlockedCourses.includes(c.id)) {
                        const count = state.coursePlayCounts[c.id] || 0;
                        if (count < 3) {
                            neededCourseName = getPlainTitle(c.name);
                            remainingPlays = 3 - count;
                            break;
                        }
                    }
                }
                if (neededCourseName) break;
            }

            if (neededCourseName) {
                messages.unshift(`🎯 『${neededCourseName}』コースをあと${remainingPlays}回プレイしたら、新しいコースがゲットできるよ！`);
            }

            const chosen = messages[Math.floor(Math.random() * messages.length)];
            msgText.textContent = chosen;
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            if (!container) return;
            container.innerHTML = '';

            COURSE_CATEGORIES.forEach(cat => {
                const catEl = document.createElement('div');
                catEl.className = 'space-y-2';

                catEl.innerHTML = `
                    <div class="flex items-center gap-2 text-sm sm:text-base font-extrabold text-slate-700 pb-1 border-b-2 border-slate-200">
                        <i class="fa-solid ${cat.icon} text-${cat.color}-500"></i>
                        <span>${renderRubyTitle(cat.name)}</span>
                    </div>
                    <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-1.5 sm:gap-2" id="cat-grid-${cat.id}"></div>
                `;
                container.appendChild(catEl);

                const grid = catEl.querySelector(`#cat-grid-${cat.id}`);

                cat.courses.forEach(course => {
                    const isUnlocked = state.unlockedCourses.includes(course.id);
                    const playCount = state.coursePlayCounts[course.id] || 0;
                    const isCompleted = playCount >= 3;
                    const isSelected = state.selectedCourse === course.id;

                    const btn = document.createElement('button');
                    btn.dataset.courseId = course.id;

                    let btnClasses = "p-1.5 rounded-xl border text-center transition-all shadow-sm flex flex-col items-center justify-between min-h-[38px] relative overflow-hidden ";
                    
                    if (!isUnlocked) {
                        btnClasses += "bg-slate-100 border-slate-300 text-slate-400 opacity-80 cursor-not-allowed";
                    } else if (isCompleted) {
                        btnClasses += "bg-emerald-50 hover:bg-emerald-100 border-emerald-400 text-emerald-800 ";
                        if (isSelected) btnClasses += "ring-2 ring-emerald-300 scale-105 font-black ";
                    } else {
                        btnClasses += "bg-white hover:border-sky-400 text-slate-700 border-slate-200 ";
                        if (isSelected) btnClasses += "border-sky-500 ring-2 ring-sky-200 scale-105 font-black ";
                    }

                    btn.className = btnClasses;

                    if (!isUnlocked) {
                        btn.innerHTML = `
                            <div class="text-[10px] sm:text-xs text-slate-400"><i class="fa-solid fa-lock mr-0.5"></i>？？？</div>
                            <div class="text-[9px] text-slate-400 mt-0.5 leading-none">ロック中</div>
                        `;
                        btn.onclick = () => {
                            sound.playLock();
                            alert('🔒 このコースはまだロックされています！現在プレイできるコースをすべて3回以上クリアすると、新しい日にランダムで解放されます。');
                        };
                    } else {
                        btn.innerHTML = `
                            <div class="font-bold text-[10px] sm:text-xs leading-tight">
                                ${renderRubyTitle(course.name)}
                            </div>
                            ${isCompleted ? '<div class="mt-0.5 text-[9px] bg-emerald-500 text-white font-extrabold px-1.5 py-0.2 rounded-full leading-none"><i class="fa-solid fa-check mr-0.5"></i>済</div>' : '<div class="mt-0.5 text-[9px] text-slate-400 leading-none">PLAY:' + playCount + '/3</div>'}
                        `;
                        btn.onclick = () => {
                            sound.playTick();
                            state.selectedCourse = course.id;
                            saveState();
                            renderCategories();
                        };
                    }

                    grid.appendChild(btn);
                });
            });
        }

        function updateHeaderStats() {
            document.getElementById('unlocked-count-text').textContent = state.unlockedCourses.length;
            document.getElementById('total-score-text').textContent = state.totalScore.toLocaleString();
            document.getElementById('streak-text').textContent = state.loginStreak;
        }

        function renderKeyboard() {
            const r1 = ['Q','W','E','R','T','Y','U','I','O','P'];
            const r2 = ['A','S','D','F','G','H','J','K','L'];
            const r3 = ['Z','X','C','V','B','N','M'];

            const makeKeys = (keys, containerId) => {
                const el = document.getElementById(containerId);
                if (!el) return;
                el.innerHTML = '';
                keys.forEach(k => {
                    const keyEl = document.createElement('div');
                    keyEl.dataset.key = k.toLowerCase();
                    keyEl.className = 'key-cap bg-slate-100 border border-slate-300 w-7 h-8 sm:w-10 sm:h-9 rounded-lg flex items-center justify-center font-mono font-extrabold text-xs sm:text-sm text-slate-700';
                    keyEl.textContent = k;
                    el.appendChild(keyEl);
                });
            };

            makeKeys(r1, 'kbd-row-1');
            makeKeys(r2, 'kbd-row-2');
            makeKeys(r3, 'kbd-row-3');
        }

        function highlightKey(key) {
            document.querySelectorAll('.key-cap').forEach(el => el.classList.remove('active'));
            if (!key) return;
            const target = document.querySelector(`.key-cap[data-key="${key.toLowerCase()}"]`);
            if (target) target.classList.add('active');
        }

        function startGame() {
            sound.init();
            if (!state.selectedCourse) return;

            const modal = document.getElementById('countdown-modal');
            const countText = document.getElementById('countdown-text');
            modal.classList.remove('hidden');

            let count = 3;
            countText.textContent = count;
            sound.playTick();

            const timer = setInterval(() => {
                count -= 1;
                if (count > 0) {
                    countText.textContent = count;
                    sound.playTick();
                } else if (count === 0) {
                    countText.textContent = 'スタート！';
                    sound.playStart();
                } else {
                    clearInterval(timer);
                    modal.classList.add('hidden');
                    initPlayScreen();
                }
            }, 800);
        }

        function initPlayScreen() {
            document.getElementById('top-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.remove('hidden');

            let courseObj = null;
            COURSE_CATEGORIES.forEach(cat => cat.courses.forEach(c => {
                if (c.id === state.selectedCourse) courseObj = c;
            }));

            document.getElementById('playing-course-title').innerHTML = courseObj ? renderRubyTitle(courseObj.name) : 'タイピング';

            game.active = true;
            game.courseId = state.selectedCourse;
            game.words = shuffleArray([...getCourseWords(state.selectedCourse)]);
            game.wordIndex = 0;
            game.score = 0;
            game.correctCount = 0;
            game.missCount = 0;
            game.timer = state.selectedTime;
            game.startTime = Date.now();

            document.getElementById('game-score').textContent = '0';
            document.getElementById('game-timer').textContent = game.timer === 0 ? '∞' : game.timer;

            nextWord();

            if (state.selectedTime > 0) {
                game.timerInterval = setInterval(() => {
                    game.timer -= 1;
                    document.getElementById('game-timer').textContent = game.timer;
                    if (game.timer <= 0) {
                        endGame();
                    }
                }, 1000);
            }
        }

        function nextWord() {
            if (game.wordIndex >= game.words.length) {
                game.words = shuffleArray([...getCourseWords(game.courseId)]);
                game.wordIndex = 0;
            }

            game.currWord = game.words[game.wordIndex];
            game.wordIndex += 1;

            const kanji = game.currWord[0];
            const kana = game.currWord[1];

            adjustTextSizeForSingleLine(kanji, kana);

            document.getElementById('target-display').innerHTML = state.rubyOn ? `<ruby>${kanji}<rt>${kana}</rt></ruby>` : kanji;
            document.getElementById('kana-display').textContent = kana;

            game.currKana = kana;
            game.nodes = kanaToNodes(kana);
            game.nodeIndex = 0;

            updateRomajiDisplay();
        }

        function adjustTextSizeForSingleLine(kanji, kana) {
            const targetEl = document.getElementById('target-display');
            const kanaEl = document.getElementById('kana-display');
            const romajiContainer = targetEl ? targetEl.parentElement.querySelector('.font-mono') : null;

            if (!targetEl || !kanaEl) return;

            const maxLen = Math.max(kanji ? kanji.length : 0, kana ? kana.length : 0);

            if (maxLen > 22) {
                targetEl.className = "font-extrabold text-slate-800 mb-1 whitespace-nowrap max-w-full overflow-hidden text-sm sm:text-lg";
                kanaEl.className = "font-bold text-sky-600 mb-2 tracking-wider whitespace-nowrap max-w-full overflow-hidden text-xs sm:text-base";
                if (romajiContainer) romajiContainer.className = "bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 font-mono text-xs sm:text-base tracking-wider whitespace-nowrap max-w-full overflow-x-auto";
            } else if (maxLen > 14) {
                targetEl.className = "font-extrabold text-slate-800 mb-1.5 whitespace-nowrap max-w-full overflow-hidden text-lg sm:text-2xl";
                kanaEl.className = "font-bold text-sky-600 mb-2 tracking-wider whitespace-nowrap max-w-full overflow-hidden text-sm sm:text-lg";
                if (romajiContainer) romajiContainer.className = "bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 font-mono text-sm sm:text-xl tracking-wider whitespace-nowrap max-w-full overflow-x-auto";
            } else if (maxLen > 8) {
                targetEl.className = "font-extrabold text-slate-800 mb-2 whitespace-nowrap max-w-full overflow-hidden text-xl sm:text-3xl";
                kanaEl.className = "font-bold text-sky-600 mb-2.5 tracking-wider whitespace-nowrap max-w-full overflow-hidden text-base sm:text-xl";
                if (romajiContainer) romajiContainer.className = "bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 font-mono text-base sm:text-2xl tracking-widest whitespace-nowrap max-w-full overflow-x-auto";
            } else {
                targetEl.className = "font-extrabold text-slate-800 mb-2 whitespace-nowrap max-w-full overflow-hidden text-2xl sm:text-4xl";
                kanaEl.className = "font-bold text-sky-600 mb-3 tracking-wider whitespace-nowrap max-w-full overflow-hidden text-lg sm:text-2xl";
                if (romajiContainer) romajiContainer.className = "bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 font-mono text-lg sm:text-2xl tracking-widest whitespace-nowrap max-w-full overflow-x-auto";
            }
        }

        // Helper function to normalize Katakana to Hiragana and strip non-typable symbols
        function normalizeKana(str) {
            if (!str) return '';
            let hira = str.replace(/[\u30a1-\u30f6]/g, ch => 
                String.fromCharCode(ch.charCodeAt(0) - 0x60)
            );
            return hira.replace(/[「」〜『』・\s　“”:：。、]/g, '');
        }

        function kanaToNodes(rawKana) {
            const kana = normalizeKana(rawKana);
            let nodes = [];
            let i = 0;

            while (i < kana.length) {
                // Check 1: Smart Sokuon ('っ') handling for consonant doubling
                if (kana[i] === 'っ') {
                    let nextOpts = [];
                    if (i + 1 < kana.length) {
                        if (i + 2 < kana.length) {
                            const pairNext = kana.substring(i + 1, i + 3);
                            if (KANA_ROMAJI_MAP[pairNext]) {
                                nextOpts = KANA_ROMAJI_MAP[pairNext];
                            }
                        }
                        if (nextOpts.length === 0) {
                            const singleNext = kana[i + 1];
                            if (KANA_ROMAJI_MAP[singleNext]) {
                                nextOpts = KANA_ROMAJI_MAP[singleNext];
                            }
                        }
                    }

                    let sokuonOpts = [];
                    nextOpts.forEach(opt => {
                        if (opt && opt.length > 0) {
                            const firstChar = opt[0].toLowerCase();
                            if (!['a', 'e', 'i', 'o', 'u'].includes(firstChar)) {
                                if (!sokuonOpts.includes(firstChar)) {
                                    sokuonOpts.push(firstChar);
                                }
                            }
                        }
                    });
                    ['xtu', 'ltu', 'xtsu', 'ltsu'].forEach(o => {
                        if (!sokuonOpts.includes(o)) sokuonOpts.push(o);
                    });

                    nodes.push({
                        options: [...sokuonOpts],
                        currentOptions: [...sokuonOpts],
                        typedCount: 0,
                        finalOption: ''
                    });
                    i += 1;
                    continue;
                }

                // Check 2: 2-character combo lookup
                let matchOptions = null;
                let consumed = 1;

                if (i + 1 < kana.length) {
                    const pair = kana.substring(i, i + 2);
                    if (KANA_ROMAJI_MAP[pair]) {
                        matchOptions = KANA_ROMAJI_MAP[pair];
                        consumed = 2;
                    }
                }

                // Check 3: 1-character lookup
                if (!matchOptions) {
                    const single = kana[i];
                    if (KANA_ROMAJI_MAP[single]) {
                        matchOptions = KANA_ROMAJI_MAP[single];
                    } else {
                        matchOptions = [single.toLowerCase()];
                    }
                    consumed = 1;
                }

                nodes.push({
                    options: [...matchOptions],
                    currentOptions: [...matchOptions],
                    typedCount: 0,
                    finalOption: ''
                });

                i += consumed;
            }

            return nodes;
        }

        function updateRomajiDisplay() {
            let done = '';
            for (let i = 0; i < game.nodeIndex; i++) {
                done += game.nodes[i].finalOption;
            }

            let next = '';
            let todo = '';

            if (game.nodeIndex < game.nodes.length) {
                const currNode = game.nodes[game.nodeIndex];
                const activeOpt = currNode.currentOptions[0];

                done += activeOpt.substring(0, currNode.typedCount);
                next = activeOpt.substring(currNode.typedCount, currNode.typedCount + 1);
                todo += activeOpt.substring(currNode.typedCount + 1);

                for (let i = game.nodeIndex + 1; i < game.nodes.length; i++) {
                    todo += game.nodes[i].options[0];
                }
            }

            document.getElementById('romaji-done').textContent = done;
            document.getElementById('romaji-next').textContent = next;
            document.getElementById('romaji-todo').textContent = todo;

            highlightKey(next);
        }

        function handleKeyPress(e) {
            if (!game.active) return;
            const key = e.key.toLowerCase();
            if (key.length !== 1) return;
            if (game.nodeIndex >= game.nodes.length) return;

            const currNode = game.nodes[game.nodeIndex];
            const matching = currNode.currentOptions.filter(opt => opt[currNode.typedCount] === key);

            if (matching.length > 0) {
                sound.playType();
                game.correctCount += 1;
                game.score += 10;
                document.getElementById('game-score').textContent = game.score;

                currNode.currentOptions = matching;
                currNode.typedCount += 1;

                const completed = currNode.currentOptions.find(opt => opt.length === currNode.typedCount);
                if (completed) {
                    currNode.finalOption = completed;
                    game.nodeIndex += 1;
                    if (game.nodeIndex >= game.nodes.length) {
                        nextWord();
                        return;
                    }
                }
                updateRomajiDisplay();
            } else {
                sound.playMiss();
                game.missCount += 1;
            }
        }

        function endGame() {
            game.active = false;
            clearInterval(game.timerInterval);

            const courseId = game.courseId;
            state.coursePlayCounts[courseId] = (state.coursePlayCounts[courseId] || 0) + 1;

            const prevHigh = state.highScores[courseId] || 0;
            let isNewRecord = false;
            let earnedScore = game.score;

            if (game.score > prevHigh) {
                isNewRecord = true;
                earnedScore += 100;
                state.highScores[courseId] = game.score;
            }

            state.totalScore += earnedScore;

            checkAllPlayedCondition();
            saveState();

            document.getElementById('res-score').textContent = `${earnedScore} pt ${isNewRecord ? '(新記録+100pt!)' : ''}`;
            
            const totalKeys = game.correctCount + game.missCount;
            const acc = totalKeys > 0 ? Math.round((game.correctCount / totalKeys) * 100) : 100;
            document.getElementById('res-accuracy').textContent = `${acc}%`;

            const elapsedSec = Math.max(1, (Date.now() - game.startTime) / 1000);
            const wpm = Math.round((game.correctCount / elapsedSec) * 60);
            document.getElementById('res-wpm').textContent = `${wpm} キー/分`;

            document.getElementById('res-correct').textContent = game.correctCount;
            document.getElementById('res-miss').textContent = game.missCount;

            const recordBadge = document.getElementById('new-record-badge');
            if (isNewRecord) {
                recordBadge.classList.remove('hidden');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                recordBadge.classList.add('hidden');
            }

            document.getElementById('result-modal').classList.remove('hidden');
        }

        function checkAllPlayedCondition() {
            const allPlayed = state.unlockedCourses.every(id => (state.coursePlayCounts[id] || 0) >= 3);
            if (allPlayed) {
                const todayStr = new Date().toISOString().split('T')[0];
                state.allPlayedAchievedDate = todayStr;
            }
        }

        function exitToTop() {
            game.active = false;
            clearInterval(game.timerInterval);

            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('top-screen').classList.remove('hidden');

            updateHeaderStats();
            renderDailyMessage();
            renderCategories();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function setupSettingsModalUI() {
            const soundBtn = document.getElementById('modal-sound-btn');
            const rubyBtn = document.getElementById('modal-ruby-btn');

            const updateModalStateUI = () => {
                // Sound Button UI
                if (state.soundOn) {
                    soundBtn.textContent = 'ON';
                    soundBtn.className = 'px-5 py-1.5 rounded-xl text-white font-black bg-sky-500 hover:bg-sky-600 transition shadow-sm';
                } else {
                    soundBtn.textContent = 'OFF';
                    soundBtn.className = 'px-5 py-1.5 rounded-xl text-slate-600 font-bold bg-slate-200 hover:bg-slate-300 transition';
                }

                // Ruby Button UI
                if (state.rubyOn) {
                    rubyBtn.textContent = 'ON';
                    rubyBtn.className = 'px-5 py-1.5 rounded-xl text-white font-black bg-indigo-500 hover:bg-indigo-600 transition shadow-sm';
                } else {
                    rubyBtn.textContent = 'OFF';
                    rubyBtn.className = 'px-5 py-1.5 rounded-xl text-slate-600 font-bold bg-slate-200 hover:bg-slate-300 transition';
                }

                // Time Buttons UI
                document.querySelectorAll('#time-selector-group .time-btn').forEach(btn => {
                    const t = parseInt(btn.dataset.time, 10);
                    if (t === state.selectedTime) {
                        btn.className = 'time-btn px-2 py-2 rounded-xl bg-sky-500 text-white font-black shadow-sm border border-sky-500';
                    } else {
                        btn.className = 'time-btn px-2 py-2 rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 font-bold';
                    }
                });
            };

            // Sound Toggle
            soundBtn.onclick = () => {
                state.soundOn = !state.soundOn;
                sound.enabled = state.soundOn;
                if (state.soundOn) sound.playTick();
                saveState();
                updateModalStateUI();
            };

            // Ruby Toggle
            rubyBtn.onclick = () => {
                state.rubyOn = !state.rubyOn;
                sound.playTick();
                saveState();
                updateModalStateUI();
                renderCategories();
            };

            // Time Limit Buttons
            document.querySelectorAll('#time-selector-group .time-btn').forEach(btn => {
                btn.onclick = () => {
                    sound.playTick();
                    state.selectedTime = parseInt(btn.dataset.time, 10);
                    saveState();
                    updateModalStateUI();
                };
            });

            // Open/Close Modal Handlers
            document.getElementById('open-settings-btn').onclick = () => {
                sound.playTick();
                updateModalStateUI();
                document.getElementById('settings-modal').classList.remove('hidden');
            };

            document.getElementById('close-settings-btn').onclick = () => {
                sound.playTick();
                document.getElementById('settings-modal').classList.add('hidden');
            };
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderKeyboard();
            updateHeaderStats();
            renderDailyMessage();
            renderCategories();
            setupSettingsModalUI();

            document.getElementById('start-game-btn').onclick = () => startGame();
            document.getElementById('exit-game-btn').onclick = () => exitToTop();
            document.getElementById('res-retry-btn').onclick = () => {
                document.getElementById('result-modal').classList.add('hidden');
                startGame();
            };
            document.getElementById('res-return-btn').onclick = () => exitToTop();

            window.addEventListener('keydown', (e) => {
                if (game.active) {
                    handleKeyPress(e);
                } else if (!document.getElementById('top-screen').classList.contains('hidden') && 
                           document.getElementById('settings-modal').classList.contains('hidden') && 
                           e.key === ' ') {
                    e.preventDefault();
                    startGame();
                }
            });
        });
    </script>
</body>
